services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jooba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jooba}
      POSTGRES_DB: ${POSTGRES_DB:-jooba}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Backend reaches redis:6379; no host port to avoid clashing with local Redis.

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://jooba:jooba@db:5432/jooba}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:5173"
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  celery-worker:
    build: ./backend
    command: celery -A app.celery_app worker -Q email,ai,default -c 4 --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://jooba:jooba@db:5432/jooba}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NYLAS_API_KEY: ${NYLAS_API_KEY:-}
      NYLAS_CLIENT_ID: ${NYLAS_CLIENT_ID:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  celery-beat:
    build: ./backend
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://jooba:jooba@db:5432/jooba}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    volumes:
      - ./backend:/app

volumes:
  pgdata:
